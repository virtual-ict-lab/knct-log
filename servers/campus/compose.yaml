services:
  knct-log:
    # リリースごとに GitHub Actions がビルドする。`--build` を付けると手元でビルドする
    image: ghcr.io/virtual-ict-lab/knct-log:${KNCT_LOG_VERSION:-latest}
    build:
      context: ../..
      dockerfile: servers/campus/Dockerfile
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:3000:3000" # TLS はリバースプロキシで終端する
    restart: unless-stopped
